openapi: 3.0.3
info:
  title: Client Project Tracker API
  description: |
    REST API for managing client projects in a digital agency context.
    Authentication uses Laravel Sanctum personal access tokens (Bearer).
    
    Features:
    - Full authentication system (register, login, logout, password reset, profile management)
    - Project CRUD operations with pagination
    - Server-side filtering by status and priority
    - Server-side search by client/project name
    - Flexible sorting capabilities
  version: 1.0.0

servers:
  - url: http://localhost:8000/api
    description: Local development

tags:
  - name: Auth
    description: Sanctum token authentication and user management
  - name: Projects
    description: Client project CRUD with pagination and filtering

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    AuthUser:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        email_verified_at:
          type: string
          format: date-time
          nullable: true
          description: Null until the user verifies their email

    EmailVerifyRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 6
          description: OTP code (6 characters) or magic-link token

    EmailVerifyResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/AuthUser'

    AuthPayload:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: Sanctum API token
        user:
          $ref: '#/components/schemas/AuthUser'

    AuthSuccessResponse:
      type: object
      properties:
        message:
          type: string
        data:
          $ref: '#/components/schemas/AuthPayload'

    UserResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuthUser'

    ProjectStatus:
      type: string
      enum: [Planning, "In Progress", "On Hold", Completed]

    ProjectPriority:
      type: string
      enum: [Low, Medium, High]

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
        per_page:
          type: integer
        to:
          type: integer
          nullable: true
        total:
          type: integer
        links:
          type: object
          properties:
            first:
              type: string
              format: uri
            last:
              type: string
              format: uri
            prev:
              type: string
              format: uri
            next:
              type: string
              format: uri

    Project:
      type: object
      required:
        - id
        - client_name
        - project_name
        - status
        - priority
        - start_date
        - due_date
      properties:
        id:
          type: integer
        client_name:
          type: string
          maxLength: 100
        project_name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 1000
          nullable: true
        status:
          $ref: '#/components/schemas/ProjectStatus'
        priority:
          $ref: '#/components/schemas/ProjectPriority'
        start_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectInput:
      type: object
      required:
        - client_name
        - project_name
        - status
        - priority
        - start_date
        - due_date
      properties:
        client_name:
          type: string
          maxLength: 100
        project_name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 1000
          nullable: true
        status:
          $ref: '#/components/schemas/ProjectStatus'
        priority:
          $ref: '#/components/schemas/ProjectPriority'
        start_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
          description: Must be on or after start_date

    ProjectUpdateInput:
      type: object
      properties:
        client_name:
          type: string
          maxLength: 100
        project_name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 1000
          nullable: true
        status:
          $ref: '#/components/schemas/ProjectStatus'
        priority:
          $ref: '#/components/schemas/ProjectPriority'
        start_date:
          type: string
          format: date
        due_date:
          type: string
          format: date

    ProjectResource:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Project'

    ProjectCollection:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        links:
          type: object
        meta:
          $ref: '#/components/schemas/PaginationMeta'

paths:
  /login:
    post:
      tags: [Auth]
      summary: Login and receive a Sanctum token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '422':
          description: Invalid credentials or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /register:
    post:
      tags: [Auth]
      summary: Register a new user and receive a Sanctum token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
      responses:
        '201':
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /logout:
    post:
      tags: [Auth]
      summary: Revoke the current access token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /forgot-password:
    post:
      tags: [Auth]
      summary: Send password reset link to email
      description: Sends a password reset email with a token. Check logs for the token in development.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Password reset link sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reset-password:
    post:
      tags: [Auth]
      summary: Reset password using token from email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Invalid token or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /email/verification-notification:
    post:
      tags: [Auth]
      summary: Send email verification OTP and magic link
      security:
        - bearerAuth: []
      description: Sends a 6-character OTP and a magic-link URL to the authenticated user's email.
      responses:
        '200':
          description: Verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /email/verification-notification/resend:
    post:
      tags: [Auth]
      summary: Resend the email verification OTP
      security:
        - bearerAuth: []
      description: Resends the existing OTP if still valid, otherwise generates a new one.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Verification OTP resent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /email/verify:
    post:
      tags: [Auth]
      summary: Verify email with a 6-character OTP
      description: Validates the OTP sent by email and marks the user's email as verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequest'
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerifyResponse'
        '422':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /email/verify-magic:
    post:
      tags: [Auth]
      summary: Verify email via magic link token
      description: Validates the magic-link token from the email. No-op success if the user is already verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequest'
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerifyResponse'
        '422':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user:
    get:
      tags: [Auth]
      summary: Get the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user/profile-information:
    put:
      tags: [Auth]
      summary: Update user profile information
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                  maxLength: 255
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/AuthUser'
        '401':
          description: Unauthenticated
        '422':
          description: Validation error (e.g., email already taken)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user/password:
    put:
      tags: [Auth]
      summary: Update user password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password:
                  type: string
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthenticated
        '422':
          description: Validation error (e.g., incorrect current password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects:
    get:
      tags: [Projects]
      summary: Get paginated projects with optional filtering and sorting
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
            maximum: 100
          description: Items per page (max 100)
        - name: search
          in: query
          schema:
            type: string
          description: Search in client_name and project_name
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProjectStatus'
          description: Filter by status
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/ProjectPriority'
          description: Filter by priority
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [client_name, project_name, start_date, due_date, status, priority]
            default: start_date
          description: Field to sort by
        - name: sort_direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Sort direction
      responses:
        '200':
          description: Paginated list of projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCollection'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Projects]
      summary: Create a new project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResource'
        '401':
          description: Unauthenticated
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      tags: [Projects]
      summary: Get a single project
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResource'
        '401':
          description: Unauthenticated
        '404':
          description: Project not found

    put:
      tags: [Projects]
      summary: Update a project
      description: All fields are optional. Only provided fields will be updated.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateInput'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResource'
        '401':
          description: Unauthenticated
        '404':
          description: Project not found
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Projects]
      summary: Delete a project
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Project deleted
        '401':
          description: Unauthenticated
        '404':
          description: Project not found
